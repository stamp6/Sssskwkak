<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SubTrack — ติดตามค่าสมาชิกรายเดือน</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>try{var t=localStorage.getItem("subtrack.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --p:#006d6d;
  --p-hover:#005555;
  --on-p:#ffffff;
  --pc:#d3eceb;
  --on-pc:#002020;
  --tc:#ffdcbc;
  --on-tc:#2e1500;
  --surf:#f6faf9;
  --sc:#ffffff;
  --sc-card:#ffffff;
  --border-subtle:rgba(0, 0, 0, 0.08);
  --border-focus:rgba(0, 109, 109, 0.4);
  --ov:#5f6e6d;
  --os:#141d1c;
  --ol:#ccd7d6;
  --er:#ba1a1a;
  --er-bg:#ffebee;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 6px 16px -4px rgba(0,0,0,.08), 0 2px 6px -2px rgba(0,0,0,.04);
  --shadow-lg:0 14px 28px -6px rgba(0,0,0,.10), 0 6px 12px -4px rgba(0,0,0,.05);
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --p:#4fd8d8;
    --p-hover:#6ee3e3;
    --on-p:#003737;
    --pc:#143837;
    --on-pc:#cce8e7;
    --tc:#412300;
    --on-tc:#ffdcc2;
    --surf:#0c1312;
    --sc:#141c1b;
    --sc-card:#182221;
    --border-subtle:rgba(255, 255, 255, 0.08);
    --border-focus:rgba(79, 216, 216, 0.4);
    --ov:#9aa8a7;
    --os:#e6edec;
    --ol:#2e3a39;
    --er:#ffb4ab;
    --er-bg:#3b1411;
    --shadow-sm:0 1px 3px rgba(0,0,0,.3);
    --shadow-md:0 6px 16px -4px rgba(0,0,0,.4);
    --shadow-lg:0 14px 28px -6px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --p:#4fd8d8;
  --p-hover:#6ee3e3;
  --on-p:#003737;
  --pc:#143837;
  --on-pc:#cce8e7;
  --tc:#412300;
  --on-tc:#ffdcc2;
  --surf:#0c1312;
  --sc:#141c1b;
  --sc-card:#182221;
  --border-subtle:rgba(255, 255, 255, 0.08);
  --border-focus:rgba(79, 216, 216, 0.4);
  --ov:#9aa8a7;
  --os:#e6edec;
  --ol:#2e3a39;
  --er:#ffb4ab;
  --er-bg:#3b1411;
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 6px 16px -4px rgba(0,0,0,.4);
  --shadow-lg:0 14px 28px -6px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  min-height:100vh;
  background:var(--surf);
  color:var(--os);
  font-family:'Noto Sans Thai','Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* App container */
.app{
  width:100%;
  max-width:1160px;
  margin:0 auto;
  padding:16px 20px 48px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* Top App Bar */
.bar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 0 20px;
}
.bar h1{
  flex:1;
  margin:0;
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.brand-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:inherit;
}
.brand-title{
  font-size:20px;
  font-weight:700;
  letter-spacing:-0.02em;
}
.brand-title span{color:var(--p)}

.bar-actions{
  display:flex;
  align-items:center;
  gap:8px;
}
.who{
  font-size:13px;
  font-weight:500;
  color:var(--ov);
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  background:var(--sc);
  border:1px solid var(--border-subtle);
  padding:6px 12px;
  border-radius:20px;
}

/* Auth Page layout improvements */
.auth-wrapper{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 0 40px;
}
.auth{
  width:100%;
  max-width:960px;
  background:transparent;
  display:grid;
  grid-template-columns:1fr;
  gap:32px;
  align-items:center;
}
@media (min-width:880px){
  .auth{
    grid-template-columns:1.05fr 0.95fr;
    gap:56px;
    padding:32px 0;
  }
}
.auth-hero{
  display:flex;
  flex-direction:column;
  gap:20px;
}
.headline{
  font-size:clamp(26px, 3.4vw, 38px);
  line-height:1.28;
  font-weight:700;
  letter-spacing:-0.02em;
  word-break:keep-all;
  overflow-wrap:break-word;
}
.headline em{
  font-style:normal;
  color:var(--p);
  background:linear-gradient(120deg, var(--p), #009688);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* Preview Card */
.preview{
  background:var(--pc);
  color:var(--on-pc);
  border-radius:var(--radius-lg);
  padding:24px 28px;
  border:1px solid var(--border-subtle);
  box-shadow:var(--shadow-sm);
}
.preview-label{font-size:13px;font-weight:600;opacity:0.85;margin-bottom:4px}
.preview .n{font-size:38px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.preview .row{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.preview .stack{justify-content:flex-start}

/* Form Container Card */
.auth-card{
  background:var(--sc-card);
  border:1px solid var(--border-subtle);
  border-radius:24px;
  padding:32px 28px;
  box-shadow:var(--shadow-md);
}
@media (max-width:480px){
  .auth-card{
    padding:24px 18px;
    border-radius:20px;
  }
}

/* Form Fields */
.fld{margin-bottom:18px}
.fld label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13.5px;
  font-weight:600;
  margin-bottom:6px;
  color:var(--os);
}
.fld input, .fld select{
  width:100%;
  height:48px;
  padding:0 16px;
  border:1.5px solid var(--ol);
  border-radius:var(--radius-md);
  background:var(--sc);
  color:var(--os);
  font-family:inherit;
  font-size:15px;
  transition:all .18s ease;
}
.fld input:focus, .fld select:focus{
  outline:none;
  border-color:var(--p);
  box-shadow:0 0 0 3.5px var(--border-focus);
}
.fld input[aria-invalid="true"]{
  border-color:var(--er);
  background-color:rgba(186, 26, 26, 0.02);
}
.fld input::placeholder{color:var(--ov);opacity:0.65}
.er{margin:6px 2px 0;color:var(--er);font-size:12.5px;font-weight:500}

/* Password wrapper */
.pw{position:relative}
.pw input{padding-right:48px}
.eye{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--ov);
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:background .15s;
}
.eye:hover{background:rgba(0,0,0,0.06)}

/* Buttons */
.btn{
  height:46px;
  padding:0 24px;
  border-radius:12px;
  border:0;
  font-family:inherit;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .18s ease;
}
.btn.f{
  background:var(--p);
  color:var(--on-p);
  box-shadow:var(--shadow-sm);
}
.btn.f:hover{
  background:var(--p-hover);
  transform:translateY(-1px);
  box-shadow:var(--shadow-md);
}
.btn.f:active{transform:translateY(0)}
.btn.o{
  background:transparent;
  border:1.5px solid var(--ol);
  color:var(--p);
}
.btn.o:hover{
  background:color-mix(in srgb, var(--p) 8%, transparent);
  border-color:var(--p);
}
.btn.o.d{color:var(--er);border-color:color-mix(in srgb,var(--er) 40%, transparent)}
.btn.o.d:hover{background:var(--er-bg);border-color:var(--er)}
.btn.t{
  background:transparent;
  color:var(--p);
  padding:0 12px;
  height:auto;
}
.btn.t:hover{text-decoration:underline}
.btn.sm{height:34px;padding:0 14px;font-size:13px;border-radius:8px}

.ibtn{
  flex:none;
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border:1px solid var(--border-subtle);
  border-radius:10px;
  background:var(--sc);
  color:var(--os);
  cursor:pointer;
  transition:all .15s;
}
.ibtn:hover{
  background:color-mix(in srgb,var(--p) 10%,transparent);
  border-color:var(--p);
}

.auth .acts{margin-top:20px}
.auth .acts .btn{width:100%;height:50px;font-size:16px;border-radius:var(--radius-md)}
.auth .sw{text-align:center;margin:20px 0 8px;font-size:14px;color:var(--ov)}
.auth .note{text-align:center;font-size:12.5px;color:var(--ov);margin-top:16px;opacity:0.85}

/* Dashboard UI */
.dash{
  display:grid;
  grid-template-columns:1fr;
  gap:24px;
}
@media (min-width:880px){
  .dash{
    grid-template-columns:360px 1fr;
    gap:32px;
    align-items:start;
  }
  .side{position:sticky;top:24px}
}

.hero{
  background:var(--pc);
  color:var(--on-pc);
  border-radius:24px;
  padding:26px;
  box-shadow:var(--shadow-sm);
  border:1px solid var(--border-subtle);
}
.hero p{margin:0;font-size:13.5px;font-weight:600;opacity:0.85}
.total{
  font-size:52px;
  font-weight:700;
  line-height:1.15;
  margin:8px 0;
  font-variant-numeric:tabular-nums;
  letter-spacing:-0.03em;
}
.hero .seg{display:flex;gap:4px;height:12px;margin:18px 0 14px}
.hero .seg i{display:block;height:100%;min-width:10px;border-radius:6px;background:var(--on-pc)}
.lg{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.lg li{display:flex;align-items:center;gap:10px;font-size:13.5px}
.lg .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--on-pc)}
.lg .ln{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg b{font-weight:600;font-variant-numeric:tabular-nums}

.next{
  margin:16px 0;
  background:var(--sc-card);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);
  padding:16px 18px;
  font-size:14.5px;
  box-shadow:var(--shadow-sm);
}
.next.soon{background:var(--tc);color:var(--on-tc);border-color:transparent}

/* Lists & Items */
.head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin:0 4px 12px;
}
.head h2{margin:0;font-size:18px;font-weight:700}
.head span{font-size:13px;font-weight:500;color:var(--ov)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.fchip{
  height:34px;
  padding:0 14px;
  border-radius:10px;
  border:1px solid var(--ol);
  background:var(--sc);
  color:var(--os);
  font-family:inherit;
  font-size:13.5px;
  font-weight:500;
  cursor:pointer;
  transition:all .15s ease;
}
.fchip:hover{border-color:var(--p)}
.fchip[aria-pressed="true"]{
  background:var(--pc);
  color:var(--on-pc);
  border-color:transparent;
  font-weight:600;
}

.list{
  list-style:none;
  margin:0;
  padding:0;
  background:var(--sc-card);
  border-radius:var(--radius-lg);
  border:1px solid var(--border-subtle);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
}
.list li{position:relative;transition:background .15s}
.list li+li::before{
  content:"";
  position:absolute;
  top:0;
  left:72px;
  right:16px;
  border-top:1px solid var(--border-subtle);
}
.list a{
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 18px;
  min-height:72px;
  color:inherit;
  text-decoration:none;
}
.list a:hover{background:color-mix(in srgb,var(--p) 6%,transparent)}
.list li.attn{box-shadow:inset 3.5px 0 0 var(--er)}

.av{
  flex:none;
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--p);
  color:var(--on-p);
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:16px;
  box-shadow:var(--shadow-sm);
}
.av.b{background:#fff;overflow:hidden;border:1px solid var(--border-subtle)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.stack{display:flex;justify-content:center}
.stack .av{width:40px;height:40px;border:2.5px solid var(--surf);margin-left:-10px;border-radius:50%}
.stack .av:first-child{margin-left:0}

.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;color:var(--ov);font-size:13px;margin-top:2px}
.soon-tx small{color:var(--on-tc);font-weight:600}
.pr{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}

.st{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:600}
.st.paused{background:var(--tc);color:var(--on-tc)}
.st.cancelled{background:var(--ol);color:var(--os)}
.st.overdue{background:var(--er);color:#fff}
.st.pend{background:var(--tc);color:var(--on-tc)}
.payrow{padding:0 18px 14px 78px}

.empty{
  padding:36px 20px;
  text-align:center;
  color:var(--ov);
  background:var(--sc-card);
  border-radius:var(--radius-lg);
  border:1px dashed var(--ol);
  font-size:14.5px;
}

/* FAB */
.fabrow{
  position:sticky;
  bottom:calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;
  justify-content:flex-end;
  margin-top:28px;
  pointer-events:none;
}
.fab{
  pointer-events:auto;
  display:inline-flex;
  align-items:center;
  gap:10px;
  height:52px;
  padding:0 22px 0 16px;
  border:0;
  border-radius:16px;
  background:var(--p);
  color:var(--on-p);
  font-family:inherit;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  box-shadow:var(--shadow-lg);
  transition:all .18s;
}
.fab:hover{
  background:var(--p-hover);
  transform:translateY(-2px);
}

/* Form View Container */
.narrow{
  max-width:540px;
  width:100%;
  margin:0 auto;
}
.card{
  background:var(--sc-card);
  border:1px solid var(--border-subtle);
  border-radius:24px;
  padding:28px 24px;
  box-shadow:var(--shadow-sm);
  margin-bottom:24px;
}
.sum{
  display:flex;
  align-items:center;
  gap:16px;
  background:var(--pc);
  color:var(--on-pc);
  border-radius:18px;
  padding:16px 20px;
  margin-bottom:20px;
}
.sum .av{width:48px;height:48px}
.sum b{display:block;font-size:18px;font-weight:700}
.sum small{font-size:13px;opacity:0.9}

.icrow{display:flex;align-items:center;gap:16px;margin:8px 0}
.icrow .av{width:56px;height:56px;border-radius:14px}
.icrow .hint{margin:6px 0 0;font-size:12px;color:var(--ov);line-height:1.4}

.acts{display:flex;justify-content:flex-end;gap:12px;margin-top:28px}

/* Alerts and Modals */
.alert{
  background:var(--tc);
  color:var(--on-tc);
  border-radius:var(--radius-md);
  padding:14px 18px;
  margin-bottom:20px;
  font-size:14px;
  border-left:4px solid #b35900;
}
.msg{
  margin-bottom:16px;
  padding:12px 16px;
  background:var(--tc);
  color:var(--on-tc);
  border-radius:var(--radius-md);
  font-size:13.5px;
}
.scrim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);
  display:grid;
  place-items:center;
  padding:20px;
  z-index:99;
}
.dlg{
  background:var(--sc-card);
  border-radius:24px;
  padding:28px;
  max-width:400px;
  width:100%;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border-subtle);
}
.dlg h2{margin:0 0 10px;font-size:20px;font-weight:700}
.dlg p{margin:0;color:var(--ov);font-size:14px;line-height:1.5}
.dlg.help{max-height:85vh;overflow-y:auto;max-width:480px}
.dlg ol{margin:16px 0 0;padding-left:20px;color:var(--ov);font-size:14px;line-height:1.6}
.dlg ol li{margin-bottom:10px}

.back{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  border-radius:10px;
  color:var(--os);
  margin-left:-6px;
  transition:background .15s;
}
.back:hover{background:color-mix(in srgb,var(--p) 10%,transparent)}
.state{text-align:center;padding:64px 20px}
.state h2{font-size:24px;font-weight:700;margin-bottom:8px}
.state p{color:var(--ov);margin-bottom:24px;font-size:15px}

.ai{
  display:inline-block;
  padding:2px 8px;
  border-radius:6px;
  background:var(--pc);
  color:var(--on-pc);
  font-size:11.5px;
  font-weight:700;
  margin-left:6px;
}
.fld .hint{margin:6px 0 0;font-size:12.5px;color:var(--ov)}

@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .app.enter>*{animation:in .25s ease-out both}
}
</style>

<script>
const SB_URL='https://wacfnwicqatpbnpafbzi.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhY2Zud2ljcWF0cGJucGFmYnppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODk1OTYsImV4cCI6MjEwNzI2NTU5Nn0.B20as7XeP19k8EpNXId4QT8hNvM5XsF28oIgR4szf30';
const MO=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
let catTouched=false,aiModel=null,filter='all',loading=true,authMsg='',draftIcon,curSub=null,helpOpen=false,user=null,authMode='login',authErr=null,subs=[],err=false,form=null,delId=null;
const baht=n=>'฿'+Number(n).toLocaleString('en-US');

function aiRows(text){const r=[];for(const l of text.split('\n')){const t=l.trim();if(!t||t[0]==='#')continue;const i=t.indexOf(':');const c=t.slice(0,i).trim();for(const n of t.slice(i+1).split('|')){const s=n.trim();if(s)r.push([s,c])}}return r}
function aiGrams(text){
  const out=[];
  for(const w0 of text.toLowerCase().replace(/\s+/g,' ').split(' ')){
    if(!w0)continue;const w=' '+w0+' ',L=w.length;
    for(let n=2;n<=4;n++){let o=0;out.push(w.slice(o,o+n));while(o+n<L){o++;out.push(w.slice(o,o+n))}if(o===0)break}
  }
  return out;
}
function aiVariants(n){return [...new Set([n,n.toLowerCase(),n.toUpperCase(),n+' premium',n+' รายเดือน','สมาชิก '+n,n.replace(/ /g,'')])]}
async function aiTrain(rows,opt={}){
  const C=opt.C||10,iters=opt.iters||200,lr=opt.lr||0.1;
  const docs=[],ys=[];for(const [n,c] of rows)for(const v of aiVariants(n)){docs.push(v);ys.push(c)}
  const classes=[...new Set(ys)].sort(),K=classes.length,N=docs.length;
  const vocab=new Map(),df=[];
  const counts=docs.map(d=>{const m=new Map();for(const g of aiGrams(d))m.set(g,(m.get(g)||0)+1);for(const g of m.keys()){if(!vocab.has(g)){vocab.set(g,vocab.size);df.push(0)}df[vocab.get(g)]++}return m});
  const V=vocab.size,idf=df.map(x=>Math.log((1+N)/(1+x))+1);
  const X=counts.map(m=>{const idx=[],val=[];let s=0;for(const [g,c] of m){const j=vocab.get(g),v=c*idf[j];idx.push(j);val.push(v);s+=v*v}s=Math.sqrt(s)||1;return {idx,val:val.map(v=>v/s)}});
  const Y=ys.map(c=>classes.indexOf(c));
  const W=new Float64Array(K*V),B=new Float64Array(K),mW=new Float64Array(K*V),vW=new Float64Array(K*V),mB=new Float64Array(K),vB=new Float64Array(K);
  const lam=1/(C*N),gW=new Float64Array(K*V),gB=new Float64Array(K),z=new Float64Array(K);
  for(let t=1;t<=iters;t++){
    gW.fill(0);gB.fill(0);
    for(let i=0;i<N;i++){
      const {idx,val}=X[i];
      for(let k=0;k<K;k++){let s=B[k];for(let q=0;q<idx.length;q++)s+=W[k*V+idx[q]]*val[q];z[k]=s}
      let mx=-1e9;for(let k=0;k<K;k++)if(z[k]>mx)mx=z[k];let sum=0;for(let k=0;k<K;k++){z[k]=Math.exp(z[k]-mx);sum+=z[k]}
      for(let k=0;k<K;k++){const g=(z[k]/sum-(k===Y[i]?1:0))/N;gB[k]+=g;for(let q=0;q<idx.length;q++)gW[k*V+idx[q]]+=g*val[q]}
    }
    const b1=.9,b2=.999,c1=1-Math.pow(b1,t),c2=1-Math.pow(b2,t);
    for(let p=0;p<K*V;p++){const g=gW[p]+lam*W[p];mW[p]=b1*mW[p]+(1-b1)*g;vW[p]=b2*vW[p]+(1-b2)*g*g;W[p]-=lr*(mW[p]/c1)/(Math.sqrt(vW[p]/c2)+1e-8)}
    for(let k=0;k<K;k++){const g=gB[k];mB[k]=b1*mB[k]+(1-b1)*g;vB[k]=b2*vB[k]+(1-b2)*g*g;B[k]-=lr*(mB[k]/c1)/(Math.sqrt(vB[k]/c2)+1e-8)}
    if(t%15===0)await new Promise(r=>setTimeout(r));
  }
  return {classes,vocab,idf,W,B,V,K};
}
function aiPredict(m,text){
  const c=new Map();for(const g of aiGrams(text))if(m.vocab.has(g)){const j=m.vocab.get(g);c.set(j,(c.get(j)||0)+1)}
  if(!c.size)return {label:'อื่นๆ',guess:'',confidence:0};
  let s=0;const f=[];for(const [j,n] of c){const v=n*m.idf[j];f.push([j,v]);s+=v*v}s=Math.sqrt(s);
  const z=m.classes.map((_,k)=>{let a=m.B[k];for(const [j,v] of f)a+=m.W[k*m.V+j]*v/s;return a});
  const mx=Math.max(...z),e=z.map(x=>Math.exp(x-mx)),t=e.reduce((a,b)=>a+b),p=e.map(x=>x/t);
  let b=0;for(let k=1;k<p.length;k++)if(p[k]>p[b])b=k;
  return {label:p[b]>=0.65?m.classes[b]:'อื่นๆ',guess:m.classes[b],confidence:p[b]};
}

const ST={active:'ใช้งานอยู่',overdue:'ค้างจ่าย',paused:'หยุดชั่วคราว',cancelled:'ยกเลิกแล้ว'},SO={active:0,overdue:1,paused:2,cancelled:3};
function latestDue(day,start){
  const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),sd=start?parseD(start):null;
  for(let i=0;i<3;i++){
    const b=new Date(t.getFullYear(),t.getMonth()-i,1),dim=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();
    const d=new Date(b.getFullYear(),b.getMonth(),Math.min(day,dim));
    if(d<=t)return (sd&&d<sd)?null:d;
  }
  return null;
}

function payInfo(s){
  if(s.status==='overdue')return {st:'overdue',due:latestDue(s.day,s.start)||nextDate(s.day,s.start)};
  if(s.status!=='active')return {st:'ok'};
  const ld=latestDue(s.day,s.start);
  if(!ld)return {st:'ok'};
  const c=new Date(s.created),cd=new Date(c.getFullYear(),c.getMonth(),c.getDate());
  if(ld<cd||(s.paidFor&&s.paidFor>=iso(ld)))return {st:'ok'};
  const od=-daysTo(ld);
  return {st:od>=3?'overdue':'pending',od,due:ld};
}

const field=(id,lb,type,v,e,ph,extra='')=>{
  const pw=type==='password';
  return `<div class="fld"><label for="${id}">${lb}</label>${pw?'<div class="pw">':''}<input id="${id}" type="${type}" value="${esc(v)}" placeholder="${ph}" ${extra}${e?' aria-invalid="true"':''}>${pw?`<button class="eye" type="button" data-act="eye" data-for="${id}" aria-label="แสดงรหัสผ่าน">${EYE}</button></div>`:''}${e?`<p class="er">${e}</p>`:''}</div>`
};

function formView(s){
  const f=form||{vals:s?{name:s.name,price:s.price,date:iso(nextDate(s.day,s.start))}:{name:'',price:'',date:''},errs:{}};
  const v=f.vals,e=f.errs,id=s?s.id:'';curSub=s;
  const icon=curIcon(),stv=f.vals.status||(s&&s.status)||'active',cv=f.vals.category!==undefined?f.vals.category:((s&&s.category)||'');
  const pi=s?payInfo(s):{st:'ok'};
  const payBox=pi.st!=='ok'?`<div class="alert"><b>${pi.st==='overdue'?'ค้างจ่าย':'รอยืนยันการจ่าย'}</b> รอบตัดเงิน ${fmtD(pi.due)}<div style="margin-top:10px"><button class="btn f sm" data-act="paid" data-id="${id}">ยืนยันว่าจ่ายแล้ว</button></div></div>`:'';
  
  return `<div class="narrow">`+bar(s?'แก้ไขบริการ':'เพิ่มบริการใหม่',true)+`<div class="card">`+
  (s?`<div class="sum">${avatar(s)}<div><b>${esc(s.name)}</b><small>${s.status&&s.status!=='active'?`<span class="st ${s.status}">${ST[s.status]}</span> `:''}${baht(s.price)} / เดือน · ถัดไป ${fmtD(nextDate(s.day,s.start))}</small></div></div>`:'')+
  payBox+iconRow(v.name,icon)+
  field('f-name','ชื่อบริการ','text',v.name,e.name,'เช่น Netflix, Spotify, iCloud')+
  `<div class="fld"><label for="f-cat">หมวดหมู่ <span class="ai">AI Auto-Detect</span></label><select id="f-cat"><option value="">ไม่ระบุ</option>${CATS.map(c=>`<option value="${c}"${cv===c?' selected':''}>${c}</option>`).join('')}</select><p class="hint" id="ai-hint"></p></div>`+
  field('f-price','ราคาต่อเดือน (บาท)','text',v.price,e.price,'เช่น 349 หรือ 99.50','inputmode="decimal"')+
  field('f-date','วันตัดเงินครั้งถัดไป','date',v.date,e.date,'')+
  `<div class="fld"><label for="f-status">สถานะ</label><select id="f-status">${Object.entries(ST).filter(([k])=>k!=='overdue'||stv==='overdue').map(([k,t])=>`<option value="${k}"${stv===k?' selected':''}>${t}</option>`).join('')}</select></div>`+
  (e.general?`<p class="er" role="alert">${esc(e.general)}</p>`:'')+
  `<div class="acts">${s?`<button class="btn o d" data-act="ask-del" data-id="${id}">ลบรายการ</button>`:'<button class="btn o" data-act="cancel">ยกเลิก</button>'}<button class="btn f" data-act="save" data-id="${id}">บันทึกข้อมูล</button></div></div></div>`;
}

function errorView(){
  return bar('SubTrack',false,out())+`<div class="state"><h2>ไม่สามารถโหลดข้อมูลได้</h2><p>เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล โปรดลองใหม่อีกครั้ง</p><button class="btn f" data-act="retry">ลองเชื่อมต่อใหม่</button></div>`;
}

function helpView(){
  return `<div class="scrim"><div class="dlg help" role="dialog" aria-modal="true"><h2>วิธีใช้งาน SubTrack</h2><ol>
  <li>กดปุ่ม <b>เพิ่มรายการ</b> ด้านล่างขวาเพื่อเพิ่มบริการที่สมัครไว้</li>
  <li>กรอกชื่อบริการ ราคา และวันตัดเงิน ระบบมี AI ช่วยแนะนำหมวดหมู่และใส่โลโก้ให้อัตโนมัติ</li>
  <li>หน้าแรกจะรวมค่าใช้จ่ายรายเดือน และคำนวณเปรียบเทียบเป็นรายปี</li>
  <li>เมื่อถึงรอบบิล คุณสามารถกดยืนยันว่าชำระแล้วได้เพื่อติดตามสถานะได้ถูกต้อง</li>
  </ol><div class="acts"><button class="btn f" data-act="close-help">เข้าใจแล้ว</button></div></div></div>`;
}

let lastRk='';
function paint(h){
  const a=document.getElementById('app'),k=(user?'u':'x')+(location.hash||'#/');
  a.className='app'+(k!==lastRk?' enter':'');
  lastRk=k;
  a.innerHTML=h;
}

function loginView(){
  const reg=authMode==='register',f=authErr||{vals:{u:''},errs:{}},e=f.errs;
  const ic=['netflix','spotify','youtube','chatgpt','icloud'].map(n=>avatar({name:n})).join('');
  
  return `<div class="bar" style="padding:12px 0 0">
    <div class="brand-badge">${mark(36)}<span class="brand-title">Sub<span>Track</span></span></div>
    <div style="flex:1"></div>
    ${themeBtn()}
  </div>
  <div class="auth-wrapper">
    <div class="auth">
      <div class="auth-hero">
        <h2 class="headline">${reg?'เริ่มต้นจัดการค่าสมัคร <em>ในที่เดียวแบบมืออาชีพ</em>':'รู้ทันทุกบิลรายเดือน <em>จ่ายเท่าไหร่เมื่อไหร่</em> รู้ล่วงหน้า'}</h2>
        <div class="preview">
          <p class="preview-label">ตัวอย่างยอดรวมรายเดือน</p>
          <div class="n">฿1,376</div>
          <div class="row">
            <div class="stack">${ic}</div>
            <small style="font-weight:600;opacity:0.9">5 บริการที่ใช้งาน</small>
          </div>
        </div>
      </div>
      <div class="auth-card">
        <h3 style="font-size:20px;font-weight:700;margin-bottom:6px">${reg?'สร้างบัญชีใหม่':'เข้าสู่ระบบ'}</h3>
        <p style="font-size:13.5px;color:var(--ov);margin-bottom:20px">${reg?'บันทึกและซิงค์ข้อมูลค่าสมาชิกของคุณฟรี':'ยินดีต้อนรับกลับเข้าสู่ระบบจัดการบิล'}</p>
        ${authMsg?`<p class="msg">${esc(authMsg)}</p>`:''}
        ${field('a-user','อีเมล','email',f.vals.u,e.u,'you@example.com','autocomplete="email" autocapitalize="none"')}
        ${field('a-pass','รหัสผ่าน','password','',e.p,'อย่างน้อย 6 ตัวอักษร',`autocomplete="${reg?'new-password':'current-password'}"`)}
        ${reg?field('a-pass2','ยืนยันรหัสผ่าน','password','',e.p2,'พิมพ์รหัสผ่านอีกครั้ง','autocomplete="new-password"'):''}
        <div class="acts">
          <button class="btn f" data-act="${reg?'register':'login'}">${reg?'สมัครสมาชิกและเริ่มต้นใช้งาน':'เข้าสู่ระบบ'}</button>
        </div>
        <p class="sw">${reg?'มีบัญชีผู้ใช้อยู่แล้ว?':'ยังไม่มีบัญชีใช้งาน?'} <button class="btn t" data-act="toggle-auth">${reg?'เข้าสู่ระบบ':'สมัครสมาชิกฟรี'}</button></p>
        <p class="note">ข้อมูลจะถูกเชื่อมต่อและเก็บรักษาอย่างปลอดภัยผ่าน Supabase</p>
      </div>
    </div>
  </div>`;
}

function render(){
  if(loading){paint('<div class="state"><p style="font-weight:600">กำลังเชื่อมต่อข้อมูล...</p></div>');return}
  if(!user){paint(loginView());return}
  const h=location.hash||'#/',m=h.match(/^#\/item\/(.+)$/);
  let html;
  if(err)html=errorView();
  else if(h==='#/add')html=formView(null);
  else if(m){
    const s=subs.find(x=>x.id===m[1]);
    html=s?formView(s)+(delId===s.id?`<div class="scrim"><div class="dlg" role="dialog" aria-modal="true"><h2>ยืนยันการลบ</h2><p>คุณต้องการลบ <b>${esc(s.name)}</b> ออกจากรายการใช่หรือไม่?</p><div class="acts"><button class="btn o" data-act="cancel-del">ยกเลิก</button><button class="btn f" style="background:var(--er)" data-act="confirm-del" data-id="${s.id}">ลบรายการ</button></div></div></div>`:''):dashboard()
  }
  else html=dashboard();
  paint(html+(helpOpen?helpView():''));
}

function go(h){
  const cur=location.hash||'#/';
  if(cur===h||(h==='#/'&&(cur==='#'||cur===''))){
    form=null;delId=null;helpOpen=false;draftIcon=undefined;catTouched=false;render()
  }else location.hash=h;
}

addEventListener('hashchange',()=>{form=null;delId=null;helpOpen=false;draftIcon=undefined;catTouched=false;render()});

document.getElementById('app').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,val=i=>document.getElementById(i).value;
  if(a==='toggle-auth'){authMode=authMode==='login'?'register':'login';authErr=null;return render()}
  if(a==='logout'){await sb.auth.signOut();return}
  if(a==='login'||a==='register'){
    const u=val('a-user').trim().toLowerCase(),p=val('a-pass'),errs={};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u))errs.u='กรุณากรอกอีเมลให้ถูกต้อง';
    if(p.length<6)errs.p='รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร';
    else if(a==='register'&&p!==val('a-pass2'))errs.p2='รหัสผ่านไม่ตรงกัน';
    if(Object.keys(errs).length){authErr={vals:{u},errs};return render()}
    b.disabled=true;
    if(a==='register'){
      const {data,error}=await sb.auth.signUp({email:u,password:p});
      if(error){authErr={vals:{u},errs:{u:error.message}};return render()}
      if(!data.session){authMsg='ส่งลิงก์ยืนยันไปที่ '+u+' แล้ว กรุณาตรวจสอบอีเมล';authMode='login';authErr=null;return render()}
    }else{
      const {error}=await sb.auth.signInWithPassword({email:u,password:p});
      if(error){authErr={vals:{u},errs:{p:/confirm/i.test(error.message)?'ยังไม่ได้ยืนยันอีเมล กรุณากดยืนยันในกล่องข้อความ':'อีเมลหรือรหัสผ่านไม่ถูกต้อง'}};return render()}
    }
    authErr=null;authMsg='';
    return;
  }
  if(a==='add')go('#/add');
  else if(a==='cancel')go('#/');
  else if(a==='retry'){loading=true;render();await fetchSubs();loading=false;render()}
  else if(a==='pick-icon')document.getElementById('f-icon').click();
  else if(a==='clear-icon'){form={vals:{name:val('f-name'),price:val('f-price'),date:val('f-date'),status:val('f-status'),category:val('f-cat')},errs:{}};draftIcon='';render()}
  else if(a==='paid'){const s=subs.find(x=>x.id===id);if(s){b.disabled=true;await sb.from('subscriptions').update({last_paid_for:iso(latestDue(s.day,s.start)||new Date()),status:'active'}).eq('id',id);await fetchSubs();render()}}
  else if(a==='eye'){const i=document.getElementById(b.dataset.for),on=i.type==='password';i.type=on?'text':'password';b.innerHTML=on?EYEOFF:EYE}
  else if(a==='theme'){const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('subtrack.theme',t)}catch(x){}render()}
  else if(a==='filter'){filter=b.dataset.v;render()}
  else if(a==='help'){helpOpen=true;render()}
  else if(a==='close-help'){helpOpen=false;render()}
  else if(a==='ask-del'){delId=id;render()}
  else if(a==='cancel-del'){delId=null;render()}
  else if(a==='confirm-del'){await sb.from('subscriptions').delete().eq('id',id);await fetchSubs();delId=null;go('#/')}
  else if(a==='save'){
    const vals={name:val('f-name').trim(),price:val('f-price').trim(),date:val('f-date'),status:val('f-status'),category:val('f-cat')},errs={},pr=Number(vals.price.replace(/,/g,''));
    if(!vals.name)errs.name='กรุณากรอกชื่อบริการ';
    else if(vals.name.length>80)errs.name='ชื่อยาวเกินไป (ไม่เกิน 80 ตัวอักษร)';
    if(!/^\d+(\.\d{1,2})?$/.test(vals.price.replace(/,/g,''))||pr<=0)errs.price='ระบุราคาให้ถูกต้อง (เช่น 299 หรือ 99.50)';
    else if(pr>100000)errs.price='ราคาต้องไม่เกิน 100,000 บาท';
    if(!vals.date||isNaN(new Date(vals.date)))errs.date='กรุณาเลือกวันตัดเงิน';
    if(Object.keys(errs).length){form={vals,errs};return render()}
    const day=Number(vals.date.split('-')[2]),ic=curIcon();
    b.disabled=true;
    const row={name:vals.name,price:pr,billing_day:day,icon:ic||null,status:vals.status,category:vals.category||null,start_date:vals.date},prev=id?subs.find(x=>x.id===id):null;
    if(prev&&((prev.status!=='active'&&vals.status==='active')||prev.day!==day||vals.date!==iso(nextDate(prev.day,prev.start)))){const ld=latestDue(day,vals.date);row.last_paid_for=ld?iso(ld):null}
    const r=id?await sb.from('subscriptions').update(row).eq('id',id):await sb.from('subscriptions').insert(row);
    if(r.error){const m=r.error.message||'';form={vals,errs:{general:'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'}};return render()}
    await fetchSubs();go('#/');
  }
});

document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){const b=document.querySelector('.acts .btn.f');if(b){e.preventDefault();b.click()}}});
document.getElementById('app').addEventListener('input',e=>{
  if(e.target.id==='f-name'){const pv=document.getElementById('ic-prev');if(pv)pv.innerHTML=avatar({name:e.target.value,icon:curIcon()});clearTimeout(aiT);aiT=setTimeout(aiSuggest,250)}
});
document.getElementById('app').addEventListener('change',e=>{
  if(e.target.id==='f-cat'){catTouched=true;const h=document.getElementById('ai-hint');if(h)h.textContent='';return}
  if(e.target.id!=='f-icon'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=c.height=96;
      const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);
      const g=i=>document.getElementById(i).value;
      form={vals:{name:g('f-name'),price:g('f-price'),date:g('f-date'),status:g('f-status'),category:g('f-cat')},errs:{}};
      draftIcon=c.toDataURL('image/png');render();
    };
    im.src=fr.result;
  };
  fr.readAsDataURL(e.target.files[0]);
});

let booted=false;
async function onSession(sess){
  const u=sess?sess.user.email:null;
  if(booted&&u===user)return;
  user=u;subs=[];
  if(user){loading=true;render();if(!aiModel)aiTrain(aiRows(AI_DATA),{iters:150,lr:.1}).then(m=>{aiModel=m;aiSuggest()});await fetchSubs()}
  loading=false;booted=true;go('#/');
}
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==='INITIAL_SESSION'||ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>onSession(sess),0)});
</script>
